<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#000000" />
  
  <!-- Horizontal App Nav -->
  <rect x="0" y="0" width="1200" height="64" fill="#222222" stroke="#FAF3E1" stroke-opacity="0.1" />
  <text x="50" y="38" font-family="sans-serif" font-weight="bold" font-size="16" fill="#F5F3ED">ContribShield <tspan fill="#FFF8CA" font-size="11">OSS</tspan></text>
  <text x="240" y="38" font-family="sans-serif" font-size="13" fill="#AAA9A1">Dashboard</text>
  <text x="350" y="38" font-family="sans-serif" font-size="13" fill="#AAA9A1">Scan Repository</text>
  <text x="500" y="38" font-family="sans-serif" font-size="13" fill="#AAA9A1">Findings</text>
  <text x="610" y="38" font-family="sans-serif" font-weight="bold" font-size="13" fill="#FFF8CA">Contributions + Stack</text>
  <line x1="610" y1="52" x2="760" y2="52" stroke="#FFF8CA" stroke-width="2" />

  <!-- Technology Stack Chips Bar -->
  <rect x="50" y="90" width="1100" height="70" rx="14" fill="#222222" stroke="#FAF3E1" stroke-opacity="0.1" />
  <text x="75" y="132" font-family="sans-serif" font-weight="bold" font-size="12" fill="#AAA9A1">DETECTED STACK:</text>
  <rect x="200" y="108" width="100" height="34" rx="17" fill="#000000" stroke="#FFF8CA" stroke-opacity="0.3" />
  <text x="220" y="130" font-family="sans-serif" font-size="12" fill="#FFF8CA">TypeScript</text>
  <rect x="315" y="108" width="90" height="34" rx="17" fill="#000000" stroke="#CDE3E8" stroke-opacity="0.3" />
  <text x="335" y="130" font-family="sans-serif" font-size="12" fill="#CDE3E8">Node.js</text>
  <rect x="420" y="108" width="100" height="34" rx="17" fill="#000000" stroke="#FAF3E1" stroke-opacity="0.2" />
  <text x="435" y="130" font-family="sans-serif" font-size="12" fill="#F5F3ED">GitHub Actions</text>

  <!-- Contribution Impact Graph -->
  <rect x="50" y="180" width="1100" height="260" rx="16" fill="#222222" stroke="#FAF3E1" stroke-opacity="0.1" />
  <text x="80" y="220" font-family="sans-serif" font-weight="bold" font-size="16" fill="#F5F3ED">Contribution Impact &amp; Route Graph</text>
  <text x="80" y="245" font-family="sans-serif" font-size="12" fill="#AAA9A1">Interactive dependency map connecting deterministic findings to beginner pathways.</text>

  <!-- Route Node 1 -->
  <rect x="100" y="280" width="220" height="120" rx="12" fill="#FAF3E1" stroke="#222222" />
  <text x="120" y="315" font-family="sans-serif" font-weight="bold" font-size="13" fill="#000000">Pin GitHub Action SHA</text>
  <text x="120" y="340" font-family="sans-serif" font-size="11" fill="#222222">Effort: 20m · Readiness: 92/100</text>
  <rect x="120" y="360" width="80" height="22" rx="11" fill="#FF6D1F" />
  <text x="135" y="375" font-family="sans-serif" font-weight="bold" font-size="10" fill="#000000">BEGINNER</text>

  <!-- Arrow -->
  <line x1="330" y1="340" x2="430" y2="340" stroke="#FF6D1F" stroke-width="2" stroke-dasharray="4" />

  <!-- Route Node 2 -->
  <rect x="440" y="280" width="220" height="120" rx="12" fill="#F5E7C6" stroke="#222222" />
  <text x="460" y="315" font-family="sans-serif" font-weight="bold" font-size="13" fill="#000000">Update SECURITY.md</text>
  <text x="460" y="340" font-family="sans-serif" font-size="11" fill="#222222">Effort: 15m · Governance</text>
  <rect x="460" y="360" width="80" height="22" rx="11" fill="#222222" />
  <text x="475" y="375" font-family="sans-serif" font-weight="bold" font-size="10" fill="#FFF8CA">DOCS</text>

  <!-- Route Details Card -->
  <rect x="50" y="460" width="1100" height="270" rx="16" fill="#222222" stroke="#FAF3E1" stroke-opacity="0.1" />
  <text x="80" y="500" font-family="sans-serif" font-weight="bold" font-size="16" fill="#FFF8CA">Active Route: Pin GitHub Action SHA</text>
  
  <text x="80" y="535" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FF6D1F">ACCEPTANCE CRITERIA:</text>
  <text x="80" y="560" font-family="sans-serif" font-size="12" fill="#F5F3ED">• Action uses full 40-character commit SHA instead of branch tag.</text>
  <text x="80" y="585" font-family="sans-serif" font-size="12" fill="#F5F3ED">• Inline comment documents version number (e.g. # v4.1.0).</text>
  
  <text x="600" y="535" font-family="sans-serif" font-weight="bold" font-size="12" fill="#CDE3E8">TEST PLAN:</text>
  <text x="600" y="560" font-family="sans-serif" font-size="12" fill="#F5F3ED">• Trigger CI build on a pull request branch to verify execution.</text>
  
  <rect x="80" y="640" width="220" height="46" rx="23" fill="#FFF8CA" />
  <text x="125" y="668" font-family="sans-serif" font-weight="bold" font-size="13" fill="#000000">Create Issue Draft</text>
</svg>
