<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#000000" />
  <circle cx="600" cy="100" r="300" fill="#FF6D1F" opacity="0.15" filter="blur(80px)" />

  <!-- Centered Glass Card -->
  <rect x="400" y="120" width="400" height="560" rx="20" fill="#222222" fill-opacity="0.9" stroke="#FAF3E1" stroke-opacity="0.15" />
  
  <text x="600" y="180" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="22" fill="#F5F3ED">Welcome Back</text>
  <text x="600" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#AAA9A1">Sign in with email or phone to ContribShield</text>

  <!-- Input Field 1: Identifier -->
  <text x="430" y="260" font-family="sans-serif" font-size="12" fill="#AAA9A1">EMAIL OR PHONE</text>
  <rect x="430" y="275" width="340" height="44" rx="10" fill="#000000" stroke="#FAF3E1" stroke-opacity="0.15" />
  <text x="445" y="303" font-family="sans-serif" font-size="14" fill="#F5F3ED">contributor@example.com</text>

  <!-- Input Field 2: Password -->
  <text x="430" y="350" font-family="sans-serif" font-size="12" fill="#AAA9A1">PASSWORD</text>
  <rect x="430" y="365" width="340" height="44" rx="10" fill="#000000" stroke="#FAF3E1" stroke-opacity="0.15" />
  <text x="445" y="393" font-family="sans-serif" font-size="14" fill="#AAA9A1">••••••••••••••••</text>

  <!-- Forgot Password Link -->
  <text x="770" y="435" text-anchor="end" font-family="sans-serif" font-size="12" fill="#FFF8CA">Forgot password?</text>

  <!-- Login Button -->
  <rect x="430" y="465" width="340" height="46" rx="23" fill="#FFF8CA" />
  <text x="600" y="494" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#000000">Sign in</text>

  <!-- Signup Link -->
  <text x="600" y="555" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#AAA9A1">Don't have an account? <tspan fill="#FF6D1F" font-weight="bold">Create account</tspan></text>

  <!-- Safety Badge -->
  <rect x="460" y="600" width="280" height="34" rx="17" fill="#2D120D" stroke="#FF6D1F" stroke-opacity="0.3" />
  <text x="600" y="622" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF8CA">Zero credential exposure · Supabase RLS</text>
</svg>
