<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#000000" />
  
  <!-- Horizontal App Nav -->
  <rect x="0" y="0" width="1200" height="64" fill="#222222" stroke="#FAF3E1" stroke-opacity="0.1" />
  <text x="50" y="38" font-family="sans-serif" font-weight="bold" font-size="16" fill="#F5F3ED">ContribShield <tspan fill="#FFF8CA" font-size="11">OSS</tspan></text>
  <text x="240" y="38" font-family="sans-serif" font-size="13" fill="#AAA9A1">Dashboard</text>
  <text x="350" y="38" font-family="sans-serif" font-weight="bold" font-size="13" fill="#FFF8CA">Scan Repository</text>
  <line x1="350" y1="52" x2="465" y2="52" stroke="#FFF8CA" stroke-width="2" />
  <text x="500" y="38" font-family="sans-serif" font-size="13" fill="#AAA9A1">Findings</text>
  <text x="610" y="38" font-family="sans-serif" font-size="13" fill="#AAA9A1">Contributions + Stack</text>

  <!-- URL Input Section -->
  <rect x="150" y="110" width="900" height="150" rx="16" fill="#222222" stroke="#FAF3E1" stroke-opacity="0.1" />
  <text x="180" y="150" font-family="sans-serif" font-weight="bold" font-size="14" fill="#F5F3ED">PUBLIC GITHUB REPOSITORY URL</text>
  
  <rect x="180" y="170" width="670" height="50" rx="10" fill="#000000" stroke="#FAF3E1" stroke-opacity="0.2" />
  <text x="200" y="202" font-family="monospace" font-size="14" fill="#FFF8CA">https://github.com/expressjs/express</text>
  
  <rect x="870" y="170" width="150" height="50" rx="25" fill="#FFF8CA" />
  <text x="915" y="201" font-family="sans-serif" font-weight="bold" font-size="14" fill="#000000">Start Scan</text>

  <!-- Scan State Machine Animation Stages -->
  <rect x="150" y="290" width="900" height="420" rx="16" fill="#222222" stroke="#FF6D1F" stroke-opacity="0.25" />
  <text x="180" y="335" font-family="sans-serif" font-weight="bold" font-size="18" fill="#F5F3ED">Scan Pipeline in Progress</text>
  
  <!-- Stages list -->
  <circle cx="200" cy="385" r="8" fill="#FFF8CA" />
  <text x="225" y="390" font-family="sans-serif" font-size="13" fill="#FFF8CA">✓ 1. Validating repository URL</text>

  <circle cx="200" cy="435" r="8" fill="#FFF8CA" />
  <text x="225" y="440" font-family="sans-serif" font-size="13" fill="#FFF8CA">✓ 2. Fetching repository tree metadata</text>

  <circle cx="200" cy="485" r="8" fill="#FF6D1F" />
  <text x="225" y="490" font-family="sans-serif" font-size="13" fill="#FF6D1F">▶ 3. Parsing package manifests &amp; workflows (Bounded: 60 files)</text>

  <circle cx="200" cy="535" r="8" fill="#222222" stroke="#FAF3E1" stroke-opacity="0.3" />
  <text x="225" y="540" font-family="sans-serif" font-size="13" fill="#AAA9A1">4. Querying OSV batch vulnerability database</text>

  <circle cx="200" cy="585" r="8" fill="#222222" stroke="#FAF3E1" stroke-opacity="0.3" />
  <text x="225" y="590" font-family="sans-serif" font-size="13" fill="#AAA9A1">5. Auditing GitHub Actions CI/CD security rules</text>

  <circle cx="200" cy="635" r="8" fill="#222222" stroke="#FAF3E1" stroke-opacity="0.3" />
  <text x="225" y="640" font-family="sans-serif" font-size="13" fill="#AAA9A1">6. Calculating Contribution Readiness Score</text>
</svg>
