<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#000000" />
  
  <!-- Horizontal App Nav -->
  <rect x="0" y="0" width="1200" height="64" fill="#222222" stroke="#FAF3E1" stroke-opacity="0.1" />
  <text x="50" y="38" font-family="sans-serif" font-weight="bold" font-size="16" fill="#F5F3ED">ContribShield <tspan fill="#FFF8CA" font-size="11">OSS</tspan></text>
  <text x="240" y="38" font-family="sans-serif" font-size="13" fill="#AAA9A1">Dashboard</text>
  <text x="350" y="38" font-family="sans-serif" font-size="13" fill="#AAA9A1">Scan Repository</text>
  <text x="500" y="38" font-family="sans-serif" font-size="13" fill="#AAA9A1">Findings</text>
  <text x="610" y="38" font-family="sans-serif" font-size="13" fill="#AAA9A1">Contributions + Stack</text>
  <text x="790" y="38" font-family="sans-serif" font-size="13" fill="#AAA9A1">Issue Drafts</text>
  <text x="910" y="38" font-family="sans-serif" font-weight="bold" font-size="13" fill="#FFF8CA">Profile</text>
  <line x1="910" y1="52" x2="955" y2="52" stroke="#FFF8CA" stroke-width="2" />

  <!-- Profile & Safety Panels -->
  <rect x="150" y="100" width="900" height="230" rx="16" fill="#222222" stroke="#FAF3E1" stroke-opacity="0.1" />
  <text x="190" y="145" font-family="sans-serif" font-weight="bold" font-size="18" fill="#F5F3ED">Account &amp; Appearance</text>
  
  <text x="190" y="185" font-family="sans-serif" font-size="13" fill="#AAA9A1">Email: <tspan fill="#F5F3ED">contributor@example.com</tspan></text>
  <text x="190" y="215" font-family="sans-serif" font-size="13" fill="#AAA9A1">Phone: <tspan fill="#F5F3ED">+1 555-0199 (Verified Identity)</tspan></text>
  
  <!-- Toggle: Reduced Motion -->
  <text x="190" y="265" font-family="sans-serif" font-size="13" fill="#F5F3ED">Reduced Motion</text>
  <rect x="330" y="250" width="50" height="26" rx="13" fill="#FFF8CA" />
  <circle cx="367" cy="263" r="10" fill="#000000" />

  <!-- Safety & Disclosure Accordion -->
  <rect x="150" y="355" width="900" height="380" rx="16" fill="#222222" stroke="#FAF3E1" stroke-opacity="0.1" />
  <text x="190" y="400" font-family="sans-serif" font-weight="bold" font-size="18" fill="#F5F3ED">Safety &amp; Responsible Disclosure Center</text>

  <!-- Accordion item 1 -->
  <rect x="190" y="430" width="820" height="60" rx="10" fill="#000000" stroke="#FAF3E1" stroke-opacity="0.1" />
  <text x="215" y="465" font-family="sans-serif" font-weight="bold" font-size="14" fill="#FFF8CA">✦ How does ContribShield prevent vulnerability disclosure leaks?</text>
  
  <!-- Accordion item 2 -->
  <rect x="190" y="505" width="820" height="60" rx="10" fill="#000000" stroke="#FAF3E1" stroke-opacity="0.1" />
  <text x="215" y="540" font-family="sans-serif" font-weight="bold" font-size="14" fill="#FFF8CA">✦ What happens when a sensitive secret credential is identified?</text>

  <!-- Data Management Actions -->
  <rect x="190" y="605" width="180" height="42" rx="21" fill="#000000" stroke="#CDE3E8" stroke-opacity="0.3" />
  <text x="235" y="631" font-family="sans-serif" font-weight="bold" font-size="13" fill="#CDE3E8">Export All Data</text>

  <rect x="390" y="605" width="180" height="42" rx="21" fill="#6B0B0C" />
  <text x="430" y="631" font-family="sans-serif" font-weight="bold" font-size="13" fill="#FFF8CA">Clear History</text>
</svg>
